name: Discovery scan

# Tries EVERY rule x parameter variant and EVERY weight strategy on each universe.
# Runs on the 1st of every month and on demand. Never writes decisions; it writes
# results/scan_*.md leaderboards with suggested hypotheses.

on:
  schedule:
    - cron: '23 2 1 * *'
  workflow_dispatch:
    inputs:
      universes:
        description: 'JSON list, e.g. ["bist30"] or ["bist30","sp_megacap","crypto_major"]'
        required: false
        default: '["bist30","sp_megacap","us_sectors","global_assets","crypto_major"]'
      families:
        description: "all | rules | strategies | factors"
        required: false
        default: all
      filters:
        description: "comma list or all (e.g. none,trend_sma200,regime_bench200)"
        required: false
        default: "none,trend_sma200"
      timeframes:
        description: 'JSON list of timeframes: ["1d"] or ["1h","4h","1d","1w"]'
        required: false
        default: '["1d","1w"]'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        universe: ${{ fromJSON(github.event.inputs.universes || '["bist30","sp_megacap","us_sectors","global_assets","crypto_major"]') }}
        timeframe: ${{ fromJSON(github.event.inputs.timeframes || '["1d","1w"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python run.py --scan --universe "${{ matrix.universe }}" --timeframe "${{ matrix.timeframe }}" \
            --families "${{ github.event.inputs.families || 'all' }}" \
            --filters "${{ github.event.inputs.filters || 'none,trend_sma200' }}" --telegram
      - uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.universe }}-${{ matrix.timeframe }}
          path: results/scan_*
      - name: Commit leaderboard
        run: |
          git config user.name "quant-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/scan_*
          git diff --cached --quiet && exit 0
          git commit -m "Scan ${{ matrix.universe }} ${{ matrix.timeframe }} $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((RANDOM % 20 + 5)); done
          exit 1
