name: Arena (paper, every 4h)

# 9 minutes after every 4h bar closes (UTC): recompute the ~100 arena strategies on the latest CLOSED bar,
# retire decaying ones, run the regime switcher, send Telegram changes, deploy the dashboard to GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  schedule:
    - cron: '9 0,4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: quant-lab-arena
  cancel-in-progress: false

jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: arena-data-${{ github.run_id }}
          restore-keys: arena-data-
      - name: Arena run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          LAB_CACHE_HOURS: "0"          # always refresh (incremental: only the new bars are downloaded)
        run: python run.py --arena --site site --telegram
      - name: Commit arena state to main
        run: bash scripts/commit_arena.sh "Arena $(date -u +%F_%H%M)"
      - uses: actions/upload-pages-artifact@v3
        if: hashFiles('site/data.json') != ''
        with:
          path: site

  deploy:
    needs: arena
    if: needs.arena.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true            # Pages not enabled yet -> the arena itself still succeeded
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
