# Hypothesis registry: one entry = one claim to test.
# The weekly workflow re-validates every entry with status != retired.
# `for_system` names the bot that would use the result (its repo name).
# A bot may only act on a hypothesis whose verdict in decisions/registry.json is ACCEPT.
#
# Fields:
#   id          unique, never reused
#   strategy    name from lab/strategies (python run.py --list)
#   universe    name from config/universes.yaml
#   for_system  target bot repo
#   start       first data date
#   status      active | retired
#   note        why we test it

- id: H001
  strategy: xs_momentum
  universe: bist30
