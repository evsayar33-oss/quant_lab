# Asset universes. Every strategy / rule can be tested on any universe and timeframe.
#
# Keys
#   market        bist | us | multi | crypto        (selects fundamentals source)
#   benchmark     regime filters + equal-weight comparison
#   costs         per side: commission, slippage; optional borrow_annual (shorts), funding_annual (perps)
#   risk_free     yfinance ticker of an annual % rate (^IRX = US 13-week T-bill). Sharpe is measured in excess of it.
#   fx            local-currency price of 1 USD; results are ALSO reported (and gated) in USD
#   price_limit   daily limit (BIST 0.10): orders cannot fill at a limit-locked open
#   min_adv       minimum 20-bar average traded value (local currency) to open a position
#   membership    sp500 | path/to/csv  -> historical index membership mask (survivorship control)
#   macro         macro series loaded for filters and regime reports
#
# WARNING (survivorship bias): without `membership`, lists are TODAY's members -> optimistic history.

bist30:
  market: bist
  benchmark: XU100.IS
  costs: {commission: 0.0010, slippage: 0.0010}
  risk_free: ^IRX
  fx: USDTRY=X
  price_limit: 0.10
  min_adv: 20000000
  macro: [^VIX, USDTRY=X, ^TNX, ^IRX]
  tickers: [AKBNK.IS, ARCLK.IS, ASELS.IS, BIMAS.IS, EKGYO.IS, ENKAI.IS, EREGL.IS, FROTO.IS,
            GARAN.IS, GUBRF.IS, HEKTS.IS, ISCTR.IS, KCHOL.IS, KOZAL.IS, KRDMD.IS, PETKM.IS,
            PGSUS.IS, SAHOL.IS, SASA.IS, SISE.IS, TCELL.IS, THYAO.IS, TOASO.IS, TUPRS.IS,
